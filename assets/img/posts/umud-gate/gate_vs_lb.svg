<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif" font-size="13">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">관문 예측 vs public 실제 (기준판 대비 Δ, 양수 = 악화)</text>
  <!-- grid -->
  <g stroke="#ddd">
    <line x1="200" y1="45" x2="200" y2="285"/>
    <line x1="450" y1="45" x2="450" y2="285"/>
    <line x1="616.7" y1="45" x2="616.7" y2="285"/>
  </g>
  <line x1="283.3" y1="45" x2="283.3" y2="285" stroke="#555" stroke-dasharray="4 3"/>
  <g fill="#555" text-anchor="middle">
    <text x="200" y="302">−0.005</text>
    <text x="283.3" y="302">0</text>
    <text x="450" y="302">+0.010</text>
    <text x="616.7" y="302">+0.020</text>
  </g>
  <!-- rows: y = 70,115,160,205,250 -->
  <g fill="#222" text-anchor="end">
    <text x="190" y="74">이어 학습 (mt 1판)</text>
    <text x="190" y="119">짧은 화면 FL 규칙 (새 축)</text>
    <text x="190" y="164">ori 교체: 대조 학습</text>
    <text x="190" y="209">ori 교체: 좁은 FOV</text>
    <text x="190" y="254">ori+mt 교체: 좁은 FOV</text>
  </g>
  <g stroke="#999" stroke-width="2">
    <line x1="265.6" y1="70" x2="275.7" y2="70"/>
    <line x1="262" y1="115" x2="325.3" y2="115"/>
    <line x1="520" y1="160" x2="525" y2="160"/>
    <line x1="478.3" y1="205" x2="631.7" y2="205"/>
    <line x1="486.7" y1="250" x2="631.7" y2="250"/>
  </g>
  <g fill="#ffffff" stroke="#3b6fb6" stroke-width="2.5">
    <circle cx="265.6" cy="70" r="6"/>
    <circle cx="262" cy="115" r="6"/>
    <circle cx="525" cy="160" r="6"/>
    <circle cx="478.3" cy="205" r="6"/>
    <circle cx="486.7" cy="250" r="6"/>
  </g>
  <g fill="#e07b28">
    <circle cx="275.7" cy="70" r="6"/>
    <circle cx="325.3" cy="115" r="6"/>
    <circle cx="520" cy="160" r="6"/>
    <circle cx="631.7" cy="205" r="6"/>
    <circle cx="631.7" cy="250" r="6"/>
  </g>
  <g font-size="11" fill="#c0392b">
    <text x="335" y="119">부호 틀림</text>
  </g>
  <!-- legend -->
  <circle cx="250" cy="320" r="5" fill="#ffffff" stroke="#3b6fb6" stroke-width="2.5"/>
  <text x="260" y="324" fill="#222">관문 예측</text>
  <circle cx="360" cy="320" r="5" fill="#e07b28"/>
  <text x="370" y="324" fill="#222">public 실제</text>
